<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#14265a">
  <meta name="description" content="FindIT Campus — Ave Maria College Lost and Found demo">
  <title>FindIT Campus | Ave Maria College</title>
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="styles.css?v=final-demo-1">
</head>
<body>
  <div class="app-frame">
    <header class="topbar">
      <a class="brand" href="#" aria-label="FindIT Campus home" id="brandHome">
        <img src="assets/brand/ave-maria-college-logo.png" alt="Ave Maria College seal" class="brand-seal">
        <span class="brand-copy"><strong>FindIT<span>Campus</span></strong><small>AVE MARIA COLLEGE · SCHOOL LOST &amp; FOUND</small></span>
      </a>
      <div class="topbar-right">
        <span class="demo-pill"><i></i> DEMO MODE</span>
        <button class="btn btn-primary btn-small" id="installBtn" type="button" hidden><span aria-hidden="true">↓</span> Install App</button>
        <button class="avatar-button" id="profileButton" type="button" hidden aria-label="Account menu"><span id="avatarInitials">FM</span></button>
      </div>
    </header>

    <main id="appRoot" class="app-root" aria-live="polite"></main>

    <footer class="site-footer">
      <span>© <span id="yearNow"></span> FindIT Campus · Ave Maria College</span>
      <span>Student belongings, handled with care.</span>
      <span class="demo-footer-note">Demo data stays in this browser only.</span>
    </footer>
  </div>

  <div id="modalRoot"></div>
  <div id="toastRoot" class="toast-stack" aria-live="polite" aria-atomic="true"></div>
  <script src="app.js?v=final-demo-1"></script>
</body>
</html>

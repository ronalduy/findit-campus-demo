<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#14265a"><title>Refresh FindIT Campus</title><style>body{margin:0;padding:24px;background:#f3f6fc;color:#182744;font:16px system-ui;display:grid;place-items:center;min-height:100vh}.card{max-width:520px;background:white;padding:28px;border:1px solid #e5ebf4;border-radius:20px;box-shadow:0 18px 50px #192e5b13;text-align:center}.card img{width:76px;height:76px;object-fit:contain}.btn{display:inline-block;padding:12px 18px;border-radius:12px;background:#4165f5;color:white;text-decoration:none;font-weight:800;border:0;cursor:pointer}.muted{color:#6d7b94;line-height:1.65;font-size:14px}</style></head><body><main class="card"><img src="assets/brand/ave-maria-college-logo.png" alt="Ave Maria College logo"><h1>Refresh FindIT Campus</h1><p class="muted">This helper clears the cached FindIT files and opens the latest published version. Your browser demo data remains in localStorage.</p><button class="btn" id="go">Clear old cache & reopen</button><p id="status" class="muted"></p></main><script>document.getElementById('go').addEventListener('click',async()=>{const s=document.getElementById('status');s.textContent='Clearing old website cache…';try{const regs=await navigator.serviceWorker?.getRegistrations?.()||[];for(const r of regs){if(r.scope.startsWith(location.origin+location.pathname.replace(/reset-cache\.html.*$/,'')))await r.unregister();}const keys=await caches.keys();for(const k of keys){if(k.toLowerCase().includes('findit-campus'))await caches.delete(k);}localStorage.removeItem('finditInstalledFlag');s.textContent='Cache cleared. Reopening…';setTimeout(()=>location.replace('./?fresh='+Date.now()),450);}catch(e){s.textContent='Please close the old tab and reopen the website in a new Chrome tab.';}});</script></body></html>
